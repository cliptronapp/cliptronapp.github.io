<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Connected · ClipTron</title>
<style>
  :root { --bg:#fafaf8; --fg:#1d1d1b; --muted:#5f5e5a; --line:#e4e2da; --accent:#534AB7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#ecebe6; --muted:#a8a69e; --line:#2e2e2b; --accent:#AFA9EC; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:720px; margin:0 auto; padding:56px 20px; }
  textarea { width:100%; height:120px; padding:10px; font:13px/1.5 ui-monospace,Consolas,monospace; color:var(--fg);
             background:transparent; border:1px solid var(--line); border-radius:8px; resize:vertical; }
  button { margin-top:10px; padding:9px 16px; font:inherit; border:1px solid var(--accent); color:var(--accent);
           background:transparent; border-radius:8px; cursor:pointer; }
  p { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1 id="title">Almost done</h1>
  <p id="msg">Copy the full address below and paste it into the terminal where ClipTron is waiting.</p>
  <textarea id="url" readonly></textarea>
  <button id="copy" type="button">Copy address</button>
  <p>This page runs entirely in your browser and sends nothing anywhere.</p>
</main>
<script>
  var box = document.getElementById('url');
  box.value = location.href;
  if (/[?&]error=/.test(location.search)) {
    document.getElementById('title').textContent = 'Authorization was not completed';
    document.getElementById('msg').textContent = 'The platform returned an error. Go back to the terminal and start the connection again.';
  }
  document.getElementById('copy').onclick = function () {
    box.select();
    var done = function () { document.getElementById('copy').textContent = 'Copied'; };
    if (navigator.clipboard) { navigator.clipboard.writeText(box.value).then(done, function () { document.execCommand('copy'); done(); }); }
    else { document.execCommand('copy'); done(); }
  };
</script>
</body>
</html>
